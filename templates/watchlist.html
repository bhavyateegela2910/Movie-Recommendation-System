<!DOCTYPE html>
<html>

<head>

    <title>Watchlist</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        MovieAI
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

    </div>

</nav>

<div class="result-container">

    <h1>My Watchlist</h1>

    <div class="movie-grid">

        {% for movie in movies %}

        <div class="movie-card">

            <h3>{{ movie }}</h3>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
